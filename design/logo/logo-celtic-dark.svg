<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- LotoLivre Final App Icon — Dark Mode Edition -->
  <!-- Mathematical Celtic Ring Knot Weave: 4 Interlocking Rings -->
  <!-- Numbers: 10, 11, 46, 33 (Century Sum: 10 + 11 + 33 + 46 = 100) -->
  <rect width="512" height="512" rx="115" fill="#0B0F0D"/>

  <g transform="translate(256, 256)">
    <!-- Outer Precision Geometry Alignment Ring -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="#1A2922" stroke-width="2"/>

    <!-- ======================================================== -->
    <!-- 4-WAY BALANCED ROTATIONAL CELTIC RING KNOT              -->
    <!-- Geometry: d=78px, R=70px, r=36px (Isolated Punch-Holes)  -->
    <!-- ======================================================== -->

    <!-- Quadrant 1 (Top: 0°) — Number 10 (Over Right, Under Left) -->
    <g transform="translate(0, -78)">
      <path d="M 0,-70 A 70,70 0 1,0 0,70 A 70,70 0 1,0 0,-70 Z M 0,-36 A 36,36 0 1,1 0,36 A 36,36 0 1,1 0,-36 Z" 
            fill="#347C5A" fill-rule="evenodd"/>
      <circle cx="0" cy="0" r="53" fill="none" stroke="#95D5B2" stroke-width="2.5" opacity="0.6"/>
      <text x="0" y="10" font-family="monospace, 'Roboto Mono', sans-serif" font-size="28" font-weight="900" fill="#74C69D" text-anchor="middle">10</text>
    </g>

    <!-- Quadrant 2 (Right: 90°) — Number 11 (Over Bottom, Under Top) -->
    <g transform="translate(78, 0)">
      <!-- Cutout over Top Ring overlap -->
      <path d="M -70,0 A 70,70 0 0,1 -20,-60" fill="none" stroke="#0B0F0D" stroke-width="8"/>
      <path d="M 0,-70 A 70,70 0 1,0 0,70 A 70,70 0 1,0 0,-70 Z M 0,-36 A 36,36 0 1,1 0,36 A 36,36 0 1,1 0,-36 Z" 
            fill="#2D6A4F" fill-rule="evenodd"/>
      <circle cx="0" cy="0" r="53" fill="none" stroke="#74C69D" stroke-width="2.5" opacity="0.5"/>
      <text x="0" y="10" font-family="monospace, 'Roboto Mono', sans-serif" font-size="28" font-weight="900" fill="#74C69D" text-anchor="middle">11</text>
    </g>

    <!-- Quadrant 3 (Bottom: 180°) — Number 46 (Over Left, Under Right) -->
    <g transform="translate(0, 78)">
      <path d="M 0,-70 A 70,70 0 0,1 60,-20" fill="none" stroke="#0B0F0D" stroke-width="8"/>
      <path d="M 0,-70 A 70,70 0 1,0 0,70 A 70,70 0 1,0 0,-70 Z M 0,-36 A 36,36 0 1,1 0,36 A 36,36 0 1,1 0,-36 Z" 
            fill="#1B4332" fill-rule="evenodd"/>
      <circle cx="0" cy="0" r="53" fill="none" stroke="#2D6A4F" stroke-width="2.5" opacity="0.6"/>
      <text x="0" y="10" font-family="monospace, 'Roboto Mono', sans-serif" font-size="28" font-weight="900" fill="#74C69D" text-anchor="middle">46</text>
    </g>

    <!-- Quadrant 4 (Left: 270°) — Number 33 (Over Top, Under Bottom) -->
    <g transform="translate(-78, 0)">
      <path d="M 0,70 A 70,70 0 0,1 20,60" fill="none" stroke="#0B0F0D" stroke-width="8"/>
      <!-- Notch cutting across Top ring to complete cyclic knot -->
      <path d="M 70,0 A 70,70 0 0,1 20,-60" fill="none" stroke="#0B0F0D" stroke-width="8"/>
      <path d="M 0,-70 A 70,70 0 1,0 0,70 A 70,70 0 1,0 0,-70 Z M 0,-36 A 36,36 0 1,1 0,36 A 36,36 0 1,1 0,-36 Z" 
            fill="#235840" fill-rule="evenodd"/>
      <circle cx="0" cy="0" r="53" fill="none" stroke="#52B788" stroke-width="2.5" opacity="0.5"/>
      <text x="0" y="10" font-family="monospace, 'Roboto Mono', sans-serif" font-size="28" font-weight="900" fill="#74C69D" text-anchor="middle">33</text>
    </g>

    <!-- Center Floating Golden Star in Negative Space -->
    <circle cx="0" cy="0" r="22" fill="#0B0F0D"/>
    <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" fill="#D4AF37"/>
  </g>
</svg>