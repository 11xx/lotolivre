<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Android 13+ Material You Monochromatic Vector Stencil -->
  <!-- Numbers: 10, 11, 46, 33 (Century Sum: 10 + 11 + 33 + 46 = 100) -->
  <g fill="#FFFFFF" transform="translate(256, 256)">
    
    <!-- 4 Annular Spheres (d=78, R=70, r=36) -->
    <!-- Top Leaf: 10 -->
    <path d="M 0,-148 A 70,70 0 1,0 0,-8 A 70,70 0 1,0 0,-148 Z M 0,-114 A 36,36 0 1,1 0,-42 A 36,36 0 1,1 0,-114 Z" fill-rule="evenodd"/>
    
    <!-- Right Leaf: 11 -->
    <path d="M 78,-70 A 70,70 0 1,0 78,70 A 70,70 0 1,0 78,-70 Z M 78,-36 A 36,36 0 1,1 78,36 A 36,36 0 1,1 78,-36 Z" fill-rule="evenodd"/>
    
    <!-- Bottom Leaf: 46 -->
    <path d="M 0,8 A 70,70 0 1,0 0,148 A 70,70 0 1,0 0,8 Z M 0,42 A 36,36 0 1,1 0,114 A 36,36 0 1,1 0,42 Z" fill-rule="evenodd"/>
    
    <!-- Left Leaf: 33 -->
    <path d="M -78,-70 A 70,70 0 1,0 -78,70 A 70,70 0 1,0 -78,-70 Z M -78,-36 A 36,36 0 1,1 -78,36 A 36,36 0 1,1 -78,-36 Z" fill-rule="evenodd"/>
  </g>

  <!-- Numbers & Cutout Lines in Background Contrast Color (Monochrome Stencil) -->
  <g fill="#000000" transform="translate(256, 256)">
    <!-- Floating Numbers inside the punch-holes -->
    <text x="0" y="-68" font-family="monospace, 'Roboto Mono', sans-serif" font-size="28" font-weight="900" text-anchor="middle">10</text>
    <text x="78" y="10" font-family="monospace, 'Roboto Mono', sans-serif" font-size="28" font-weight="900" text-anchor="middle">11</text>
    <text x="0" y="88" font-family="monospace, 'Roboto Mono', sans-serif" font-size="28" font-weight="900" text-anchor="middle">46</text>
    <text x="-78" y="10" font-family="monospace, 'Roboto Mono', sans-serif" font-size="28" font-weight="900" text-anchor="middle">33</text>
    
    <!-- Center Cutout Star -->
    <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z"/>
  </g>
</svg>