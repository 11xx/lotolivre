<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Figtree:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #4b5563; } a:hover { color: #111827; }
    .screen, .sheet { font-family: 'Google Sans', Figtree, Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .theme-light { --bg:#FAF9FC; --surface:#FFFFFF; --ink:#191A1F; --muted:#54535D; --line:#E4E2EA;
      --aL:0.54; --aC:0.15; --sL:0.945; --sC:0.045; --kL:0.40; --kC:0.12;
      --wL:0.982; --wC:0.016; --eL:0.905; --eC:0.038; --oL:0.99; --oC:0.005; }
    .theme-dark { --bg:#0F1014; --surface:#18181E; --ink:#E8E5ED; --muted:#ACAAB6; --line:#2B2A33;
      --aL:0.80; --aC:0.14; --sL:0.33; --sC:0.070; --kL:0.93; --kC:0.065;
      --wL:0.225; --wC:0.026; --eL:0.345; --eC:0.048; --oL:0.20; --oC:0.045; }
    .g { --accent: oklch(var(--aL) var(--aC) var(--h));
         --soft:   oklch(var(--sL) var(--sC) var(--h));
         --chipink:oklch(var(--kL) var(--kC) var(--h));
         --wash:   oklch(var(--wL) var(--wC) var(--h));
         --edge:   oklch(var(--eL) var(--eC) var(--h));
         --onaccent: oklch(var(--oL) var(--oC) var(--h)); }
    .tnum { font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
    .nums { display: flex; flex-wrap: wrap; gap: 7px; }
    .num { font-variant-numeric: tabular-nums; font-weight: 500; font-size: 15px;
           width: 34px; height: 34px; border-radius: 999px; background: var(--accent); color: var(--onaccent);
           display: flex; align-items: center; justify-content: center; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
    .step { display: flex; align-items: center; justify-content: center; gap: 5px; height: 44px; padding: 0 12px;
            border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; }
    .ball { font-variant-numeric: tabular-nums; font-weight: 500; font-size: 18px;
            width: 46px; height: 46px; border-radius: 999px; background: var(--accent); color: var(--onaccent);
            display: flex; align-items: center; justify-content: center; }
    .row { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.75fr) minmax(0, 1.1fr); align-items: center; gap: 8px; padding: 11px 14px; }
  </style>
</helmet>

  <div style="display: flex; align-items: center; gap: 8px; padding: 4px 16px 14px;">

      Anterior
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 1px;">
      <span class="tnum" style="font-size: 14px; font-weight: 700;">Concurso 3047</span>
      <span class="tnum" style="font-size: 11px; color: var(--muted);">20/08/2026</span>
    </div>
    <div class="step" style="color: var(--muted); opacity: 0.45;">
      Próximo
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px 24px;">

    <section style="background: var(--wash); border: 1px solid var(--edge); border-radius: 16px; padding: 16px 14px;">
      <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between;">
        <span class="ball">04</span><span class="ball">18</span><span class="ball">22</span>
        <span class="ball">26</span><span class="ball">31</span><span class="ball">58</span>
      </div>
    </section>

    <section class="card">
      <div class="row" style="border-bottom: 1px solid var(--line);">
        <span style="font-size: 12px; font-weight: 500; color: var(--muted);">Faixa</span>
        <span style="font-size: 12px; font-weight: 500; color: var(--muted); text-align: right;">Ganhadores</span>
        <span style="font-size: 12px; font-weight: 500; color: var(--muted); text-align: right;">Prêmio</span>
      </div>
      <div class="row" style="border-bottom: 1px solid var(--line);">
        <span style="font-size: 14px; font-weight: 500;">6 acertos</span>
        <span class="tnum" style="font-size: 14px; text-align: right;">0</span>
        <span class="tnum" style="font-size: 13px; font-weight: 500; color: var(--accent); text-align: right;">Acumulou</span>
      </div>
      <div class="row" style="border-bottom: 1px solid var(--line);">
        <span style="font-size: 14px; font-weight: 500;">5 acertos</span>
        <span class="tnum" style="font-size: 14px; text-align: right;">63</span>
        <span class="tnum" style="font-size: 14px; text-align: right;">R$ 33.112,49</span>
      </div>
      <div class="row">
        <span style="font-size: 14px; font-weight: 500;">4 acertos</span>
        <span class="tnum" style="font-size: 14px; text-align: right;">4.395</span>
        <span class="tnum" style="font-size: 14px; text-align: right;">R$ 782,39</span>
      </div>
    </section>

    <section class="card" style="padding: 15px 14px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
        <span style="font-size: 13px; color: var(--muted);">Acumulado</span>
        <span class="tnum" style="font-size: 15px; font-weight: 500;">R$ 49.261.197,47</span>
      </div>
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 13px; color: var(--muted);">Estimativa 3048</span>
          <span class="tnum" style="font-size: 11px; color: var(--muted);">23/08/2026</span>
        </div>
        <span class="tnum" style="font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: -0.02em;">R$ 58.000.000,00</span>
      </div>
    </section>

    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 4px;">
      <span style="font-size: 12px; color: var(--muted);">Arrecadação</span>
      <span class="tnum" style="font-size: 12px; color: var(--muted);">R$ 52.349.916,00</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
